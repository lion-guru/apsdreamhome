name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  php-syntax:
    name: PHP Syntax Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pdo_mysql, mbstring, json, curl, openssl, zip, gd
      - name: Check PHP syntax
        run: |
          find app -name "*.php" -exec php -l {} \; 2>&1 | grep -v "No syntax errors" || true

  schema-scan:
    name: Schema Mismatch Scan
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mariadb:10.4
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: apsdreamhome
        ports:
          - 3306:3306
        options: --health-cmd="mysqladmin ping" --health-interval=10s --health-timeout=5s --health-retries=5
    steps:
      - uses: actions/checkout@v4
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pdo_mysql, mbstring, json, curl, openssl, zip, gd
      - name: Install composer dependencies
        run: composer install --no-interaction --prefer-dist || true
      - name: Import database schema
        run: |
          sleep 10
          mysql -h 127.0.0.1 -P 3306 -u root -proot apsdreamhome < database/schema.sql 2>/dev/null || echo "Schema import skipped - using existing"
      - name: Run schema scanner
        run: php testing/scan_schema_mismatches.php
        env:
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_DATABASE: apsdreamhome
          DB_USERNAME: root
          DB_PASSWORD: root

  visual-regression:
    name: Visual Regression Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install Playwright
        run: |
          cd testing/visual_tests
          npm ci
          npx playwright install --with-deps chromium
      - name: Run visual smoke tests
        run: |
          cd testing/visual_tests
          node E2E_MASTER_TEST.mjs
        env:
          BASE_URL: http://localhost:8000

  flutter-analyze:
    name: Flutter Analyze
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: stable
      - name: Flutter analyze
        working-directory: mobile/apsdreamhome_app_v2
        run: flutter analyze

  flutter-build-release:
    name: Build Release APK
    runs-on: ubuntu-latest
    needs: [flutter-analyze]
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: stable
      - name: Build release APK
        working-directory: mobile/apsdreamhome_app_v2
        run: |
          flutter build apk --release
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: apsdreamhome-release-apk
          path: mobile/apsdreamhome_app_v2/build/app/outputs/flutter-apk/app-release.apk
          retention-days: 7