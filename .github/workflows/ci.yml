name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  php-syntax:
    name: PHP Syntax Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pdo_mysql, mbstring, json, curl, openssl, zip, gd
      - name: Check PHP syntax
        run: |
          find app -name "*.php" -exec php -l {} \; 2>&1 | grep -v "No syntax errors" || true

  schema-scan:
    name: Schema Mismatch Scan
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mariadb:10.4
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: apsdreamhome
        ports:
          - 3306:3306
        options: --health-cmd="mysqladmin ping" --health-interval=10s --health-timeout=5s --health-retries=5
    steps:
      - uses: actions/checkout@v4
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pdo_mysql, mbstring, json, curl, openssl, zip, gd
      - name: Install composer dependencies
        run: composer install --no-interaction --prefer-dist || true
      - name: Import database schema
        run: |
          sleep 10
          # S465: database/schema.sql is a 17 KB, 15-table fragment from
          # April 2026 and does NOT contain a single table the app uses
          # (users, plots, properties, leads, wallet_points ... all missing).
          # The scanner compares the app's SQL against the schema, so against
          # that fragment it was comparing against fiction.  Use the real
          # schema (1043 tables, no rows).
          mysql -h 127.0.0.1 -P 3306 -u root -proot apsdreamhome < database/schema_current.sql \
            || echo "Schema import failed - using whatever the service created"
      - name: Apply migrations on top of the imported schema
        # S467: the schema dump is a SNAPSHOT, so a column added by a migration
        # after the dump was taken is missing in CI - and the scanner then
        # reports it as a phantom column and fails the gate (that is exactly
        # what happened with the 9 columns of migration S466).  Running the
        # idempotent migrations makes the CI schema converge on the live one.
        # A migration that fails is reported but does not fail the job: the
        # scanner below is the real gate.
        run: |
          for f in database/migrations/*.php; do
            [ -e "$f" ] || continue
            php "$f" > /dev/null 2>&1 || echo "  (skipped: $f)"
          done
          echo "migrations applied"
        env:
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_DATABASE: apsdreamhome
          DB_USERNAME: root
          DB_PASSWORD: root
      - name: Run schema scanner
        run: |
          # S465: testing/scan_schema_mismatches.php DID NOT EXIST, so this
          # job printed "Schema scanner not found, skipping" and went GREEN -
          # a no-op gate.  The scanner now exists and the job FAILS if it is
          # missing again.
          if [ ! -f testing/scan_schema_mismatches.php ]; then
            echo "::error::testing/scan_schema_mismatches.php is missing - the schema gate would be a no-op"
            exit 1
          fi
          php testing/scan_schema_mismatches.php \
            --baseline=database/schema_mismatch_baseline.txt
        env:
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_DATABASE: apsdreamhome
          DB_USERNAME: root
          DB_PASSWORD: root

  # Visual regression is handled by visual-regression.yml (dedicated workflow)
  # Removed redundant job here to avoid duplicate runs.

  flutter-analyze:
    name: Flutter Analyze
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          # S453: the Flutter SDK is PINNED on purpose.  With only
          # `channel: stable` the runner picks up whatever stable is on the
          # day, and the 2026-11-11 stable release (3.50.0) deprecated
          # package:flutter/material.dart, which turned 281 imports into
          # analyzer infos - and infos are fatal for `flutter analyze`.
          # Bumping this needs the package:material_ui migration (note:
          # flutter_localizations still ships the SDK's MaterialLocalizations,
          # so it has to be migrated together).
          flutter-version: '3.47.9'
          channel: stable
      - name: Flutter analyze
        working-directory: mobile/apsdreamhome_app_v2
        run: flutter analyze
      - name: Guard against dependency drift
        # S453: the pinned SDK must resolve EXACTLY the committed lockfile.
        # When it did not, the runner re-resolved 7 packages on every run and
        # printed "Changed 7 dependencies!" - and the analysis in CI then
        # differed from the analysis on a developer machine (that is how 281
        # material_ui infos appeared in CI but not locally).  Fail loudly
        # instead of drifting silently.
        run: |
          if ! git diff --exit-code -- \
               mobile/apsdreamhome_app_v2/pubspec.lock \
               mobile/apsdreamhome_app_v2/analysis_options.yaml; then
            echo "::error::pubspec.lock / analysis_options.yaml are out of date for the pinned Flutter SDK."
            echo "Run 'flutter pub get' with Flutter 3.47.9 locally and commit the result."
            git diff -- mobile/apsdreamhome_app_v2/pubspec.lock mobile/apsdreamhome_app_v2/analysis_options.yaml
            exit 1
          fi
          echo "Dependency lockfile is in sync with the pinned SDK."

  flutter-build-release:
    name: Build Release APK
    runs-on: ubuntu-latest
    needs: [flutter-analyze]
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          # S453: the Flutter SDK is PINNED on purpose.  With only
          # `channel: stable` the runner picks up whatever stable is on the
          # day, and the 2026-11-11 stable release (3.50.0) deprecated
          # package:flutter/material.dart, which turned 281 imports into
          # analyzer infos - and infos are fatal for `flutter analyze`.
          # Bumping this needs the package:material_ui migration (note:
          # flutter_localizations still ships the SDK's MaterialLocalizations,
          # so it has to be migrated together).
          flutter-version: '3.47.9'
          channel: stable
      - name: Setup JDK 17
        id: setup-java
        # S453: the runner's default JDK is 25, which Gradle 8.14 does not
        # support ("The Java version used for the build is 25.0.5, which is
        # incompatible with Gradle 8.14").  The project itself targets Java
        # 17 (sourceCompatibility/targetCompatibility = VERSION_17).
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Build release APK
        working-directory: mobile/apsdreamhome_app_v2
        env:
          JAVA_HOME: ${{ steps.setup-java.outputs.path }}
        run: |
          flutter config --jdk-dir="$JAVA_HOME"
          # S453: the upload keystore (android/key.properties) is a secret and
          # is not on the runner, so the release build falls back to the debug
          # keystore.  Make sure that keystore exists before Gradle needs it.
          if [ ! -f "$HOME/.android/debug.keystore" ]; then
            mkdir -p "$HOME/.android"
            keytool -genkeypair -v \
              -keystore "$HOME/.android/debug.keystore" \
              -storepass android -keypass android -alias androiddebugkey \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi
          flutter build apk --release
          # The Flutter tool sometimes reports "failed to produce an .apk file"
          # even when Gradle wrote it - look for the artifact ourselves.
          ls -la build/app/outputs/flutter-apk/ 2>/dev/null || true
          ls -la android/app/build/outputs/flutter-apk/ 2>/dev/null || true
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: apsdreamhome-release-apk
          # S453: depending on the Flutter/Gradle version the APK lands in
          # build/app/outputs/ or android/app/build/outputs/ - take both.
          path: |
            mobile/apsdreamhome_app_v2/build/app/outputs/flutter-apk/app-release.apk
            mobile/apsdreamhome_app_v2/android/app/build/outputs/flutter-apk/app-release.apk
          if-no-files-found: warn
          retention-days: 7