# =============================================================================
# APS Dream Home - Production Deployment
# Deploys to production server via SSH with zero-downtime rolling restart
#
# Triggers:
#   - Push to main (manual approval via GitHub Environment)
#   - workflow_dispatch (manual trigger)
#
# Required GitHub Secrets:
#   PROD_HOST              - production server hostname/IP
#   PROD_USER              - SSH username
#   PROD_SSH_KEY           - SSH private key (PEM format)
#   PROD_DEPLOY_PATH       - absolute path on server (e.g. /opt/apsdreamhome)
#   PROD_APP_URL           - production URL (e.g. https://apsdreamhome.com)
#   DOCKER_USERNAME        - Docker Hub username (optional)
#   DOCKER_TOKEN           - Docker Hub access token (optional)
#   SLACK_WEBHOOK          - Slack incoming webhook for notifications (optional)
# =============================================================================

name: Deploy Production

on:
  push:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      skip_tests:
        description: 'Skip test job (emergency hotfix)'
        required: false
        default: 'false'

# Cancel any in-flight deploy when a new commit lands
concurrency:
  group: production-deploy
  cancel-in-progress: false

env:
  REGISTRY: docker.io
  IMAGE_OWNER: apsdreamhome
  APP_IMAGE: apsdreamhome/app
  WS_IMAGE: apsdreamhome/websocket
  PHP_VERSION: "8.2"

jobs:
  # ---------------------------------------------------------------------------
  # 1. TEST - PHP syntax + E2E
  # ---------------------------------------------------------------------------
  test:
    name: Test (PHP syntax + E2E)
    runs-on: ubuntu-latest
    if: github.event_name != 'workflow_dispatch' || github.event.inputs.skip_tests != 'true'

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: rootroot
          MYSQL_DATABASE: apsdreamhome_test
          MYSQL_USER: testuser
          MYSQL_PASSWORD: testpass
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 50

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ env.PHP_VERSION }}
          extensions: pdo, pdo_mysql, mysqli, mbstring, zip, curl, gd, intl, sockets, bcmath
          ini-values: post_max_size=256M, upload_max_filesize=256M, memory_limit=1G

      - name: Detect changed PHP files
        id: changed
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE="${{ github.base_ref }}"
            HEAD="${{ github.head_ref }}"
            git fetch origin "$BASE" --depth=50
            CHANGED=$(git diff --name-only "origin/$BASE"...HEAD -- '*.php' | grep -v -E '^(_archive|vendor|node_modules|aaaaa|mobile|nbproject)/' || true)
          else
            CHANGED=$(git diff --name-only HEAD~1 -- '*.php' | grep -v -E '^(_archive|vendor|node_modules|aaaaa|mobile|nbproject)/' || true)
          fi
          echo "changed_files<<EOF" >> $GITHUB_OUTPUT
          echo "$CHANGED" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT
          echo "Changed files: $(echo "$CHANGED" | wc -l)"

      - name: PHP syntax check (changed files)
        if: steps.changed.outputs.changed_files != ''
        run: |
          echo "${{ steps.changed.outputs.changed_files }}" > /tmp/changed.txt
          while IFS= read -r f; do
            [ -z "$f" ] && continue
            [ -f "$f" ] || continue
            echo "Checking: $f"
            php -l "$f"
          done < /tmp/changed.txt

      - name: PHP syntax check (whole project)
        run: |
          find . -name "*.php" \
            -not -path "./vendor/*" \
            -not -path "./_archive/*" \
            -not -path "./node_modules/*" \
            -not -path "./aaaaa/*" \
            -not -path "./mobile/*" \
            -not -path "./nbproject/*" \
            -exec php -l {} \; 2>&1 | grep -v "No syntax errors detected" | tee /tmp/syntax-errors.txt
          if [ -s /tmp/syntax-errors.txt ]; then
            echo "SYNTAX ERRORS DETECTED:"
            cat /tmp/syntax-errors.txt
            exit 1
          fi
          echo "All PHP files passed syntax check"

      - name: Bash syntax check (deploy scripts)
        run: |
          for f in deploy-to-production.sh scripts/backup_before_deploy.sh scripts/setup_ssl.sh scripts/health_check.sh docker-entrypoint.sh docker-smoke-test.sh docker/backup/backup.sh docker/websocket/start.sh; do
            if [ -f "$f" ]; then
              echo "Checking: $f"
              bash -n "$f"
            fi
          done

      - name: Docker compose config validation
        run: |
          docker compose -f docker-compose.yml config --quiet
          docker compose -f docker-compose.yml -f docker-compose.production.yml config --quiet

      - name: Wait for MySQL
        run: |
          for i in {1..30}; do
            mysqladmin ping -h127.0.0.1 -P3306 -uroot -prootroot --silent && break
            sleep 2
          done

      - name: Run E2E tests
        env:
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_DATABASE: apsdreamhome_test
          DB_USERNAME: root
          DB_PASSWORD: rootroot
          APP_ENV: testing
          APP_DEBUG: "false"
          APP_URL: http://localhost:8080
        run: |
          # Start PHP built-in server in background
          php -S 127.0.0.1:8080 -t . > /tmp/php-server.log 2>&1 &
          SERVER_PID=$!
          sleep 3
          # Run E2E
          if [ -f "testing/visual_tests/E2E_MASTER_TEST.mjs" ]; then
            cd testing/visual_tests
            node E2E_MASTER_TEST.mjs || echo "E2E completed with errors (non-blocking)"
            cd ../..
          else
            echo "E2E test file not found - skipping"
          fi
          kill $SERVER_PID 2>/dev/null || true

  # ---------------------------------------------------------------------------
  # 2. BUILD - Docker images
  # ---------------------------------------------------------------------------
  build:
    name: Build Docker images
    runs-on: ubuntu-latest
    needs: test
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        if: env.DOCKER_USERNAME != ''
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}

      - name: Compute image tags
        id: meta
        run: |
          SHA=$(git rev-parse --short HEAD)
          TS=$(date -u +%Y%m%d.%H%M%S)
          BRANCH=$(echo "${GITHUB_REF#refs/heads/}" | tr '/' '-')
          echo "sha=$SHA" >> $GITHUB_OUTPUT
          echo "ts=$TS" >> $GITHUB_OUTPUT
          echo "branch=$BRANCH" >> $GITHUB_OUTPUT
          echo "tags=$SHA,$SHA-$TS,latest" >> $GITHUB_OUTPUT

      - name: Build APP image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: ${{ secrets.DOCKER_USERNAME != '' }}
          tags: |
            ${{ env.IMAGE_OWNER }}/app:${{ steps.meta.outputs.sha }}
            ${{ env.IMAGE_OWNER }}/app:${{ steps.meta.outputs.sha }}-${{ steps.meta.outputs.ts }}
            ${{ env.IMAGE_OWNER }}/app:latest
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.created=${{ steps.meta.outputs.ts }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build WebSocket image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./docker/websocket/Dockerfile
          push: ${{ secrets.DOCKER_USERNAME != '' }}
          tags: |
            ${{ env.IMAGE_OWNER }}/websocket:${{ steps.meta.outputs.sha }}
            ${{ env.IMAGE_OWNER }}/websocket:${{ steps.meta.outputs.sha }}-${{ steps.meta.outputs.ts }}
            ${{ env.IMAGE_OWNER }}/websocket:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Image size report
        run: |
          docker images | grep -E "apsdreamhome/(app|websocket)" | head -5

  # ---------------------------------------------------------------------------
  # 3. DEPLOY - SSH to production, rolling restart
  # ---------------------------------------------------------------------------
  deploy:
    name: Deploy to production
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: production
      url: ${{ secrets.PROD_APP_URL }}
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.PROD_HOST }}
          username: ${{ secrets.PROD_USER }}
          key: ${{ secrets.PROD_SSH_KEY }}
          script: |
            set -euo pipefail
            cd ${{ secrets.PROD_DEPLOY_PATH }}

            echo "==== Pre-deploy backup ===="
            if [ -f scripts/backup_before_deploy.sh ]; then
              bash scripts/backup_before_deploy.sh
            fi

            echo "==== Pulling latest code ===="
            git fetch origin main
            git reset --hard origin/main

            echo "==== Running deploy script ===="
            chmod +x deploy-to-production.sh
            APP_VERSION="${{ steps.meta.outputs.sha }}" \
              HEALTHCHECK_URL="${{ secrets.PROD_APP_URL }}/health" \
              DEPLOY_BRANCH=main \
              ./deploy-to-production.sh

            echo "==== Post-deploy health check ===="
            bash scripts/health_check.sh --json | tee /tmp/health.json
            cat /tmp/health.json

      - name: Post-deploy verification
        if: success()
        run: |
          echo "Verifying production URL..."
          for i in {1..10}; do
            STATUS=$(curl -fsS -o /dev/null -w "%{http_code}" "${{ secrets.PROD_APP_URL }}/health" || echo "000")
            if [ "$STATUS" = "200" ]; then
              echo "Production health check PASSED ($STATUS)"
              exit 0
            fi
            echo "Attempt $i/10: HTTP $STATUS, retrying in 5s..."
            sleep 5
          done
          echo "Production health check FAILED"
          exit 1

      - name: Notify Slack (success)
        if: success() && env.SLACK_WEBHOOK != ''
        run: |
          curl -fsS -X POST -H "Content-Type: application/json" \
            -d '{"text":":white_check_mark: *APS Dream Home* production deploy succeeded\nCommit: ${{ github.sha }}\nActor: ${{ github.actor }}\nURL: ${{ secrets.PROD_APP_URL }}"}' \
            "${{ secrets.SLACK_WEBHOOK }}" || true

      - name: Notify Slack (failure)
        if: failure() && env.SLACK_WEBHOOK != ''
        run: |
          curl -fsS -X POST -H "Content-Type: application/json" \
            -d '{"text":":x: *APS Dream Home* production deploy FAILED\nCommit: ${{ github.sha }}\nActor: ${{ github.actor }}\nCheck: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"}' \
            "${{ secrets.SLACK_WEBHOOK }}" || true
