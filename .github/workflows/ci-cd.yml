name: CI/CD Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

env:
  PHP_VERSION: '8.2'
  NODE_VERSION: '20'

jobs:
  lint:
    name: Lint & Syntax Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ env.PHP_VERSION }}
          extensions: mbstring, pdo_mysql, redis, gd, curl, zip, bcmath, intl
          ini-values: memory_limit=512M
      
      - name: Check PHP Syntax
        run: |
          find app -name "*.php" -exec php -l {} \; 2>&1 | grep -v "No syntax errors" || true
          find config -name "*.php" -exec php -l {} \; 2>&1 | grep -v "No syntax errors" || true
          find routes -name "*.php" -exec php -l {} \; 2>&1 | grep -v "No syntax errors" || true
      
      - name: Install Composer Dependencies
        run: composer install --prefer-dist --no-progress --no-interaction
      
      - name: Run PHPStan (if available)
        run: |
          if [ -f vendor/bin/phpstan ]; then
            vendor/bin/phpstan analyse --memory-limit=512M
          else
            echo "PHPStan not installed, skipping"
          fi
      
      - name: Check Code Style (if php-cs-fixer available)
        run: |
          if [ -f vendor/bin/php-cs-fixer ]; then
            vendor/bin/php-cs-fixer fix --dry-run --diff
          else
            echo "php-cs-fixer not installed, skipping"
          fi

  test:
    name: Unit & Integration Tests
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: apsdreamhome_test
          MYSQL_USER: test
          MYSQL_PASSWORD: test
        ports:
          - 3306:3306
        options: --health-cmd="mysqladmin ping" --health-interval=10s --health-timeout=5s --health-retries=3
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: --health-cmd="redis-cli ping" --health-interval=10s --health-timeout=5s --health-retries=3
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ env.PHP_VERSION }}
          extensions: mbstring, pdo_mysql, redis, gd, curl, zip, bcmath, intl, pdo
          ini-values: memory_limit=512M
      
      - name: Install Composer Dependencies
        run: composer install --prefer-dist --no-progress --no-interaction
      
      - name: Wait for MySQL
        run: |
          for i in {1..30}; do
            mysqladmin ping -h 127.0.0.1 -u test -ptest --silent && break
            echo "Waiting for MySQL..."
            sleep 2
          done
      
      - name: Setup Test Database
        run: |
          mysql -h 127.0.0.1 -u test -ptest apsdreamhome_test < database/schema.sql 2>/dev/null || true
          # Apply migrations
          for f in database/migrations/*.php; do
            php "$f" 2>/dev/null || true
          done
      
      - name: Run Master Test Suite
        run: php testing/master_test_runner.php
        env:
          APP_ENV: testing
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_DATABASE: apsdreamhome_test
          DB_USERNAME: test
          DB_PASSWORD: test
          REDIS_HOST: 127.0.0.1
          REDIS_PORT: 6379
      
      - name: Upload Test Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: storage/logs/*.json

  build:
    name: Build Assets
    runs-on: ubuntu-latest
    needs: [lint, test]
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop'
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: mobile/apsdreamhome_app_v2/package.json
      
      - name: Install Frontend Dependencies
        run: |
          cd mobile/apsdreamhome_app_v2
          npm ci
      
      - name: Build Flutter Web
        run: |
          cd mobile/apsdreamhome_app_v2
          flutter build web --release
      
      - name: Build Flutter Android (optional)
        if: false
        run: |
          cd mobile/apsdreamhome_app_v2
          flutter build apk --release
      
      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-artifacts
          path: |
            mobile/apsdreamhome_app_v2/build/web
            public/assets/css/critical
            public/assets/js

  deploy-staging:
    name: Deploy to Staging
    runs-on: ubuntu-latest
    needs: [lint, test, build]
    if: github.ref == 'refs/heads/develop'
    environment: staging
    steps:
      - uses: actions/checkout@v4
      
      - name: Deploy to Staging
        run: |
          echo "Deploying to staging..."
          # Add your staging deployment commands here
          # Example: rsync to staging server, run migrations, clear cache
          echo "Staging deployment completed"
      
      - name: Run Smoke Tests
        run: |
          echo "Running smoke tests against staging..."
          # curl -f https://staging.apsdreamhome.com/health || exit 1

  deploy-production:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: [lint, test, build]
    if: github.ref == 'refs/heads/main'
    environment: production
    steps:
      - uses: actions/checkout@v4
      
      - name: Deploy to Production
        run: |
          echo "Deploying to production..."
          # Add your production deployment commands here
          # Example: rsync to production servers, run migrations, clear cache, warmup
          echo "Production deployment completed"
      
      - name: Run Smoke Tests
        run: |
          echo "Running smoke tests against production..."
          # curl -f https://apsdreamhome.com/health || exit 1

      - name: Notify Team
        if: always()
        run: |
          echo "Deployment ${{ job.status }} - Notifying team..."
          # Add Slack/Discord/Email notification here

  cleanup:
    name: Cleanup
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Clean up artifacts
        run: |
          echo "Cleaning up..."