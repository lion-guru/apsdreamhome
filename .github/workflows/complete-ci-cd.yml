name: APS Dream Home CI/CD Pipeline

# Comprehensive pipeline. Lighter than the deploy.yml workflow.
# Uses the new tests/migrate.php and tests/run_all_tests.php for testing.

on:
  push:
    branches: [ main, develop, feature/monitoring-alerts ]
  pull_request:
    branches: [ main, develop ]

env:
  PHP_VERSION: "8.2"
  IMAGE_NAME: aps-dream-home

jobs:
  # ---------------------------------------------------------------------------
  # 1. CODE QUALITY - PHP syntax + composer audit + project structure check
  # ---------------------------------------------------------------------------
  code-quality:
    name: Code Quality & Security
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ env.PHP_VERSION }}
          extensions: mbstring, xml, ctype, json, bcmath, gd, pdo_mysql, curl, intl, sockets

      - name: Validate composer.json
        run: composer validate --no-check-all

      - name: Install Composer dependencies
        run: composer install --no-progress --prefer-dist --optimize-autoloader

      - name: Run PHP syntax check (whole project)
        run: |
          ERRORS=0
          while IFS= read -r f; do
            if ! php -l "$f" >/dev/null 2>&1; then
              echo "SYNTAX ERROR in $f:"
              php -l "$f"
              ERRORS=$((ERRORS + 1))
            fi
          done < <(find app scripts testing tests \
            -name "*.php" \
            -not -path "./vendor/*" \
            -not -path "./_archive/*")
          if [ "$ERRORS" -gt 0 ]; then
            echo "Total syntax errors: $ERRORS"
            exit 1
          fi
          echo "All PHP files pass syntax check"

      - name: Run PHPStan (informational, non-blocking)
        continue-on-error: true
        run: |
          if [ -f vendor/bin/phpstan ]; then
            vendor/bin/phpstan analyse app --level=3 --no-progress --memory-limit=2G || echo "PHPStan warnings (informational)"
          else
            echo "PHPStan not installed"
          fi

      - name: Run PHP_CodeSniffer (informational, non-blocking)
        continue-on-error: true
        run: |
          if [ -f vendor/bin/phpcs ]; then
            vendor/bin/phpcs --standard=PSR12 app/ --report=summary || echo "PHPCS warnings (informational)"
          else
            echo "PHPCS not installed"
          fi

      - name: Composer audit
        continue-on-error: true
        run: composer audit --no-dev || echo "Composer audit warnings (informational)"

      - name: Upload quality report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: code-quality
          path: |
            phpstan-report.xml
            phpcs-report.xml
          retention-days: 7
          if-no-files-found: ignore

  # ---------------------------------------------------------------------------
  # 2. TEST SUITE - migrations + test runner
  # ---------------------------------------------------------------------------
  test:
    name: Test suite
    runs-on: ubuntu-latest
    needs: code-quality
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: rootroot
          MYSQL_DATABASE: apsdreamhome_test
          MYSQL_USER: testuser
          MYSQL_PASSWORD: testpass
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ env.PHP_VERSION }}
          extensions: pdo, pdo_mysql, mysqli, mbstring, zip, curl, gd, intl, sockets, bcmath, json
          ini-values: memory_limit=1G

      - name: Install Composer dependencies
        run: composer install --no-progress --prefer-dist --optimize-autoloader

      - name: Wait for MySQL
        run: |
          for i in {1..30}; do
            mysqladmin ping -h127.0.0.1 -P3306 -utestuser -ptestpass --silent && break
            sleep 2
          done

      - name: Run migrations
        env:
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_DATABASE: apsdreamhome_test
          DB_USERNAME: testuser
          DB_PASSWORD: testpass
          APP_ENV: testing
          APP_DEBUG: "false"
          JWT_SECRET: ci-test-secret-key-must-be-at-least-32-bytes-long
        run: php tests/migrate.php

      - name: Run test suite
        env:
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_DATABASE: apsdreamhome_test
          DB_USERNAME: testuser
          DB_PASSWORD: testpass
          APP_ENV: testing
          APP_DEBUG: "false"
          JWT_SECRET: ci-test-secret-key-must-be-at-least-32-bytes-long
        run: php tests/run_all_tests.php

      - name: Publish JUnit results
        if: always()
        uses: EnricoMi/publish-unit-test-result-action@v2
        with:
          files: tests/reports/junit.xml
          check_name: complete-ci-cd test results

      - name: Upload test artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: tests/reports/
          retention-days: 7

  # ---------------------------------------------------------------------------
  # 3. SECURITY - Trivy + composer audit
  # ---------------------------------------------------------------------------
  security-scan:
    name: Security Scanning
    runs-on: ubuntu-latest
    needs: code-quality
    steps:
      - uses: actions/checkout@v4

      - name: Run Trivy filesystem scan
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'sarif'
          output: 'trivy-results.sarif'

      - name: Upload Trivy results
        if: always()
        uses: github/codeql-action/upload-sarif@v2
        with:
          sarif_file: 'trivy-results.sarif'

  # ---------------------------------------------------------------------------
  # 4. PERFORMANCE - load test on main branch only
  # ---------------------------------------------------------------------------
  performance-test:
    name: Performance test
    runs-on: ubuntu-latest
    needs: code-quality
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/feature/monitoring-alerts'
    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ env.PHP_VERSION }}

      - name: Install Composer dependencies
        run: composer install --no-progress --prefer-dist

      - name: Run load tests
        continue-on-error: true
        run: |
          if [ -f testing/load/load_test.php ]; then
            php testing/load/load_test.php | tee load-test.log || echo "Load test warnings (informational)"
          fi
