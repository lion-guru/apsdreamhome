name: PHP Tests (Legacy)

# Kept for backwards compatibility with any external trigger URLs.
# The new canonical workflow is ci.yml. This file targets PHP 8.2
# (was 8.0 in the original, which is EOL) and routes through the
# new tests/run_all_tests.php runner.

on:
  push:
    branches: [ main, develop, feature/monitoring-alerts ]
  pull_request:
    branches: [ main, develop ]

jobs:
  test:
    name: PHP unit + integration tests
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: rootroot
          MYSQL_DATABASE: apsdreamhome_test
          MYSQL_USER: testuser
          MYSQL_PASSWORD: testpass
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP 8.2
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: pdo, pdo_mysql, mysqli, mbstring, zip, curl, gd, intl, sockets, bcmath
          ini-values: memory_limit=1G, post_max_size=256M, upload_max_filesize=256M

      - name: Install Composer dependencies
        run: composer install --no-progress --prefer-dist --optimize-autoloader

      - name: Wait for MySQL
        run: |
          for i in {1..30}; do
            mysqladmin ping -h127.0.0.1 -P3306 -utestuser -ptestpass --silent && break
            sleep 2
          done
          mysqladmin ping -h127.0.0.1 -P3306 -utestuser -ptestpass --silent

      - name: Run database migrations
        env:
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_DATABASE: apsdreamhome_test
          DB_USERNAME: testuser
          DB_PASSWORD: testpass
          APP_ENV: testing
          APP_DEBUG: "false"
          JWT_SECRET: ci-test-secret-key-must-be-at-least-32-bytes-long
        run: php tests/migrate.php

      - name: Run test suite
        env:
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_DATABASE: apsdreamhome_test
          DB_USERNAME: testuser
          DB_PASSWORD: testpass
          APP_ENV: testing
          APP_DEBUG: "false"
          JWT_SECRET: ci-test-secret-key-must-be-at-least-32-bytes-long
        run: php tests/run_all_tests.php

      - name: Publish JUnit results
        if: always()
        uses: EnricoMi/publish-unit-test-result-action@v2
        with:
          files: tests/reports/junit.xml
          check_name: PHP legacy suite

      - name: Upload JUnit XML
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: junit-php
          path: tests/reports/junit.xml
