# =============================================================================
# APS Dream Home - Redis 7 configuration
# Used for cache, sessions, queues, real-time presence
# =============================================================================

# Network
bind 0.0.0.0
port 6379
protected-mode yes
tcp-backlog 511
timeout 300
tcp-keepalive 60

# General
daemonize no
loglevel notice
logfile ""
databases 16

# Snapshotting - persistence enabled for safety
save 900 1
save 300 10
save 60 10000
stop-writes-on-bgsave-error yes
rdbcompression yes
rdbchecksum yes
dbfilename apsdreamhome.rdb
dir /data

# Append only file (AOF) - additional durability
appendonly yes
appendfilename "apsdreamhome.aof"
appendfsync everysec
no-appendfsync-on-rewrite no
auto-aof-rewrite-percentage 100
auto-aof-rewrite-min-size 64mb
aof-load-truncated yes

# Memory
maxmemory 384mb
maxmemory-policy allkeys-lru
maxmemory-samples 5

# Lazy freeing
lazyfree-lazy-eviction yes
lazyfree-lazy-expire yes
lazyfree-lazy-server-del yes
lazyfree-lazy-user-del yes

# Slow log
slowlog-log-slower-than 10000
slowlog-max-len 128

# Client output buffer
client-output-buffer-limit normal 0 0 0
client-output-buffer-limit replica 256mb 64mb 60
client-output-buffer-limit pubsub 32mb 8mb 60

# Security (uncomment + set strong password in production)
# requirepass your-strong-redis-password
# rename-command FLUSHDB ""
# rename-command FLUSHALL ""
# rename-command KEYS ""

# Threading (Redis 6+)
io-threads 2
io-threads-do-reads yes
