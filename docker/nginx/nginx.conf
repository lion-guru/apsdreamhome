user www-data;
worker_processes auto;
pid /run/nginx.pid;
error_log /var/log/nginx/error.log warn;

events {
    worker_connections 4096;
    use epoll;
    multi_accept on;
}

http {
    # -------------------------------------------------------------------------
    # MIME + charset
    # -------------------------------------------------------------------------
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    charset       utf-8;

    # -------------------------------------------------------------------------
    # Logging
    # -------------------------------------------------------------------------
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for" '
                    'rt=$request_time uct="$upstream_connect_time" '
                    'uht="$upstream_header_time" urt="$upstream_response_time"';

    log_format websocket '$remote_addr - [$time_local] "$request" '
                         '$status $body_bytes_sent '
                         '"$http_user_agent" "$http_x_forwarded_for" '
                         'conn=$connection conn_req=$connection_requests '
                         'time=$request_time';

    access_log /var/log/nginx/access.log main;

    # -------------------------------------------------------------------------
    # Performance
    # -------------------------------------------------------------------------
    sendfile           on;
    tcp_nopush         on;
    tcp_nodelay        on;
    keepalive_timeout  65;
    keepalive_requests 1000;
    types_hash_max_size 2048;
    server_tokens      off;
    client_max_body_size 50M;
    client_body_buffer_size 128k;
    client_header_buffer_size 4k;
    large_client_header_buffers 8 16k;

    # -------------------------------------------------------------------------
    # Gzip
    # -------------------------------------------------------------------------
    gzip               on;
    gzip_vary          on;
    gzip_proxied       any;
    gzip_comp_level    6;
    gzip_min_length    1024;
    gzip_disable       "msie6";
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        text/x-component
        application/json
        application/javascript
        application/x-javascript
        application/xml
        application/xml+rss
        application/atom+xml
        application/vnd.api+json
        application/xhtml+xml
        application/x-font-ttf
        font/opentype
        image/svg+xml
        image/x-icon;

    # -------------------------------------------------------------------------
    # Rate limiting zones
    # -------------------------------------------------------------------------
    limit_req_zone  $binary_remote_addr zone=api:10m    rate=10r/s;
    limit_req_zone  $binary_remote_addr zone=login:10m  rate=5r/m;
    limit_req_zone  $binary_remote_addr zone=general:10m rate=30r/s;
    limit_req_status 429;
    limit_conn_zone $binary_remote_addr zone=conn_per_ip:10m;

    # -------------------------------------------------------------------------
    # Upstream pools
    # -------------------------------------------------------------------------
    upstream php_app {
        server app:80 max_fails=3 fail_timeout=30s;
        keepalive 32;
    }

    upstream ws_server {
        # IP hash so a client stays on the same Ratchet worker
        ip_hash;
        server websocket:8080 max_fails=3 fail_timeout=30s;
        keepalive 32;
    }

    # -------------------------------------------------------------------------
    # Default server (HTTP -> HTTPS redirect when TLS is configured)
    # -------------------------------------------------------------------------
    server {
        listen      80 default_server;
        listen [::]:80 default_server;
        server_name _;

        # ACME challenge for Let's Encrypt
        location ^~ /.well-known/acme-challenge/ {
            root /var/www/certbot;
            default_type "text/plain";
            try_files $uri =404;
        }

        # Health check (used by docker healthcheck)
        location = /health {
            access_log off;
            add_header Content-Type text/plain;
            return 200 "ok\n";
        }

        # Internal status
        location = /nginx-status {
            stub_status;
            access_log off;
            allow 127.0.0.1;
            allow 172.28.0.0/16;   # docker network
            deny all;
        }

        # If SSL is configured, redirect everything else to HTTPS
        set $redirect_to_https "no";
        if ($scheme = http) {
            set $redirect_to_https "${redirect_to_https}-check";
        }
        if ($request_uri !~ "^/.well-known/acme-challenge/") {
            set $redirect_to_https "${redirect_to_https}-yes";
        }
        # Only redirect if cert files are present (checked in conf.d/ssl.conf include)
        include /etc/nginx/conf.d/ssl-redirect.conf;

        # Otherwise proxy plain HTTP to the app (useful for local dev)
        include /etc/nginx/conf.d/app.conf;
    }

    # HTTPS server (only loaded if cert files exist - via include in conf.d/)
    include /etc/nginx/conf.d/*.conf;
}
