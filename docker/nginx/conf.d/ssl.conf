# =============================================================================
# HTTPS server (only loaded if certificate files exist)
# Include this file from nginx.conf to enable TLS termination
# =============================================================================
#
# To enable HTTPS:
#  1. Drop your .crt and .key into docker/ssl/
#     e.g. docker/ssl/fullchain.pem and docker/ssl/privkey.pem
#  2. Update the ssl_certificate / ssl_certificate_key paths below if needed
#  3. Restart the nginx container: docker compose restart nginx
#  4. For Let's Encrypt, see README.DOCKER.md -> "SSL/HTTPS Setup"
#
# ----------------------------------------------------------------------

# TLS-only server block
server {
    listen      443 ssl;
    listen [::]:443 ssl;
    http2       on;
    server_name _;

    # ---- SSL certificates (mounted from docker/ssl/) ----
    ssl_certificate     /etc/ssl/certs/fullchain.pem;
    ssl_certificate_key /etc/ssl/certs/privkey.pem;

    # ---- Modern TLS configuration ----
    ssl_protocols           TLSv1.2 TLSv1.3;
    ssl_ciphers             ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_prefer_server_ciphers off;
    ssl_session_cache       shared:SSL:10m;
    ssl_session_timeout     1d;
    ssl_session_tickets     off;
    ssl_stapling            on;
    ssl_stapling_verify     on;
    resolver                1.1.1.1 8.8.8.8 valid=300s;
    resolver_timeout        5s;

    # ---- Security headers (HTTPS-strict) ----
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header X-Frame-Options             "SAMEORIGIN"        always;
    add_header X-Content-Type-Options      "nosniff"           always;
    add_header X-XSS-Protection            "1; mode=block"     always;
    add_header Referrer-Policy             "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy          "geolocation=(), microphone=(), camera=(), payment=()" always;

    # Reuse the main routing rules
    include /etc/nginx/conf.d/app.conf;
}
