# =============================================================================
# Main HTTP server (used when TLS is not configured OR as fallback)
# Proxies everything to the PHP-Apache app container
# =============================================================================

# Security headers (applied to every response)
add_header X-Frame-Options             "SAMEORIGIN"            always;
add_header X-Content-Type-Options      "nosniff"               always;
add_header X-XSS-Protection            "1; mode=block"         always;
add_header Referrer-Policy             "strict-origin-when-cross-origin" always;
add_header Permissions-Policy          "geolocation=(), microphone=(), camera=(), payment=()" always;

# Default Content-Security-Policy - loose for now because the app loads CDN assets
# Tighten this after the CSP is fully audited
add_header Content-Security-Policy     "default-src 'self' 'unsafe-inline' 'unsafe-eval' data: blob: https: http:; img-src 'self' data: https: http:; media-src 'self' https: http:; font-src 'self' data: https:;" always;

# Hide server version
server_tokens off;

# ---------------------------------------------------------------------------
# Block access to sensitive files
# ---------------------------------------------------------------------------
location ~ /\.(?!well-known) {
    deny all;
    access_log off;
    log_not_found off;
}

location ~* (?:composer\.(json|lock)|package\.json|yarn\.lock|\.env.*|\.git.*|README\.md) {
    deny all;
    access_log off;
    log_not_found off;
}

# ---------------------------------------------------------------------------
# Static assets - serve directly with long cache headers
# ---------------------------------------------------------------------------
location ~* \.(?:css|js|map|ico|png|jpg|jpeg|gif|webp|svg|woff|woff2|ttf|eot|otf|mp4|webm|ogg|mp3|wav|pdf)$ {
    access_log off;
    expires 1y;
    add_header Cache-Control "public, immutable";
    try_files $uri @app;
}

# Avatar / user uploads
location /uploads/ {
    alias /var/www/html/public/uploads/;
    expires 30d;
    add_header Cache-Control "public";
    try_files $uri @app =404;
}

# Assets uploaded by the app
location /assets/uploads/ {
    alias /var/www/html/public/assets/uploads/;
    expires 30d;
    add_header Cache-Control "public";
    try_files $uri @app =404;
}

# ---------------------------------------------------------------------------
# WebSocket upgrade - /ws/* paths are routed to the Ratchet server
# ---------------------------------------------------------------------------
location /ws/ {
    # Strip the /ws/ prefix before proxying
    rewrite ^/ws/(.*)$ /$1 break;

    proxy_pass             http://ws_server;
    proxy_http_version     1.1;
    proxy_set_header       Upgrade            $http_upgrade;
    proxy_set_header       Connection         "upgrade";
    proxy_set_header       Host               $host;
    proxy_set_header       X-Real-IP          $remote_addr;
    proxy_set_header       X-Forwarded-For    $proxy_add_x_forwarded_for;
    proxy_set_header       X-Forwarded-Proto  $scheme;
    proxy_read_timeout     86400s;     # 24h
    proxy_send_timeout     86400s;
    proxy_connect_timeout  10s;
    proxy_buffering        off;
    proxy_cache            off;
    access_log /var/log/nginx/websocket.log websocket;
}

# Direct WebSocket on root (no prefix)
location = /ws {
    proxy_pass             http://ws_server/;
    proxy_http_version     1.1;
    proxy_set_header       Upgrade            $http_upgrade;
    proxy_set_header       Connection         "upgrade";
    proxy_set_header       Host               $host;
    proxy_set_header       X-Real-IP          $remote_addr;
    proxy_set_header       X-Forwarded-For    $proxy_add_x_forwarded_for;
    proxy_set_header       X-Forwarded-Proto  $scheme;
    proxy_read_timeout     86400s;
    access_log /var/log/nginx/websocket.log websocket;
}

# ---------------------------------------------------------------------------
# API - rate limited, short timeouts
# ---------------------------------------------------------------------------
location /api/ {
    limit_req zone=api burst=20 nodelay;
    limit_conn conn_per_ip 50;

    proxy_pass             http://php_app;
    proxy_http_version     1.1;
    proxy_set_header       Host               $host;
    proxy_set_header       X-Real-IP          $remote_addr;
    proxy_set_header       X-Forwarded-For    $proxy_add_x_forwarded_for;
    proxy_set_header       X-Forwarded-Proto  $scheme;
    proxy_set_header       X-Request-ID       $request_id;
    proxy_connect_timeout  10s;
    proxy_send_timeout     60s;
    proxy_read_timeout     60s;
}

# ---------------------------------------------------------------------------
# Login / auth endpoints - stricter rate limiting
# ---------------------------------------------------------------------------
location ~ ^/(login|register|admin/login|forgot-password|reset-password|api/auth/) {
    limit_req zone=login burst=5 nodelay;

    proxy_pass             http://php_app;
    proxy_http_version     1.1;
    proxy_set_header       Host               $host;
    proxy_set_header       X-Real-IP          $remote_addr;
    proxy_set_header       X-Forwarded-For    $proxy_add_x_forwarded_for;
    proxy_set_header       X-Forwarded-Proto  $scheme;
    proxy_set_header       X-Request-ID       $request_id;
    proxy_connect_timeout  10s;
    proxy_send_timeout     30s;
    proxy_read_timeout     30s;
}

# ---------------------------------------------------------------------------
# Admin - moderate rate limiting
# ---------------------------------------------------------------------------
location /admin/ {
    limit_req zone=api burst=15 nodelay;

    proxy_pass             http://php_app;
    proxy_http_version     1.1;
    proxy_set_header       Host               $host;
    proxy_set_header       X-Real-IP          $remote_addr;
    proxy_set_header       X-Forwarded-For    $proxy_add_x_forwarded_for;
    proxy_set_header       X-Forwarded-Proto  $scheme;
    proxy_set_header       X-Request-ID       $request_id;
    proxy_connect_timeout  10s;
    proxy_send_timeout     60s;
    proxy_read_timeout     60s;
}

# ---------------------------------------------------------------------------
# Default - proxy everything else to the PHP app
# ---------------------------------------------------------------------------
location / {
    limit_req zone=general burst=50 nodelay;

    proxy_pass             http://php_app;
    proxy_http_version     1.1;
    proxy_set_header       Host               $host;
    proxy_set_header       X-Real-IP          $remote_addr;
    proxy_set_header       X-Forwarded-For    $proxy_add_x_forwarded_for;
    proxy_set_header       X-Forwarded-Proto  $scheme;
    proxy_set_header       X-Request-ID       $request_id;
    proxy_connect_timeout  10s;
    proxy_send_timeout     60s;
    proxy_read_timeout     60s;
}

# Fallback for try_files in static location blocks
location @app {
    proxy_pass             http://php_app;
    proxy_set_header       Host               $host;
    proxy_set_header       X-Real-IP          $remote_addr;
    proxy_set_header       X-Forwarded-For    $proxy_add_x_forwarded_for;
    proxy_set_header       X-Forwarded-Proto  $scheme;
}

# Custom error pages
error_page 502 503 504 /50x.html;
location = /50x.html {
    root /usr/share/nginx/html;
    internal;
}
