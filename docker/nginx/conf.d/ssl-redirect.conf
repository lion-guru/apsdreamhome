# =============================================================================
# HTTP -> HTTPS redirect logic
# Only redirects when the SSL server block is enabled (i.e. certs exist)
# =============================================================================
#
# This file is intentionally permissive in the absence of TLS.
# It contains a no-op when TLS is not yet configured.
#
# To force HTTP -> HTTPS redirect, ensure docker/ssl/fullchain.pem
# and docker/ssl/privkey.pem exist and the ssl.conf include is loaded.

# If SSL is not configured, this is a no-op.
# When SSL is configured, change the rule below to redirect.
# Uncomment the next two lines AFTER SSL is configured:
#
# if ($redirect_to_https = "yes-yes") {
#     return 301 https://$host$request_uri;
# }
