; PJSIP configuration for chan_dongle GSM Gateway
; Registers the GSM gateway as a SIP endpoint

[transport-udp]
type=transport
protocol=udp
bind=0.0.0.0:5060

[transport-tcp]
type=transport
protocol=tcp
bind=0.0.0.0:5060

; ── GSM Gateway (chan_dongle as SIP endpoint) ──
[gsm-gateway]
type=endpoint
context=outbound-calls
disallow=all
allow=ulaw
allow=alaw
allow=gsm
allow=h264
aors=gsm-gateway
auth=gsm-gateway
direct_media=no
force_rport=yes
rewrite_contact=yes

[gsm-gateway]
type=auth
type=user
username=gsm-gateway
password=ApsGsm2026!

[gsm-gateway]
type=aor
max_contacts=1
remove_existing=yes
default_expiration=120
minimum_expiration=60
maximum_expiration=3600

; ── Sales Team Extension (optional) ──
[sales]
type=endpoint
context=connect-sales
disallow=all
allow=ulaw
allow=alaw
allow=gsm
aors=sales
auth=sales
direct_media=no

[sales]
type=auth
type=user
username=sales
password=ApsSales2026!

[sales]
type=aor
max_contacts=5

; ── Phone Wizard (for outbound calls) ──
[phone-wizard]
type=wizard
sends_auth=yes
sends_reg=yes
accepts_reg=no
transport=transport-udp
endpoint/context=outbound-calls
endpoint/disallow=all
endpoint/allow=ulaw,alaw,gsm
endpoint/direct_media=no
auth/auth_user=gsm-gateway
auth/password=ApsGsm2026!
aor/max_contacts=1
