; chan_dongle configuration for Huawei USB Modem
; Place this in /etc/asterisk/dongle.conf

[general]

; ── Device Configuration ──
; Auto-detect Huawei USB modem
; For multiple modems, add [dongle0], [dongle1], etc.

[dongle0]
; Device path (auto-detected or manual)
; Use: ls /dev/ttyUSB* to find
device = /dev/ttyUSB0

; IMEI of the modem (auto-detected if empty)
imei = 

; PIN code (if SIM has PIN)
pin = 

; APN settings (auto-detected from SIM)
apn = 

; Audio settings
audio = /dev/sound/by-id/usb-C-Media_Electronics_Inc._USB_Audio_Device-00-if00

; Context for incoming calls
context = inbound-context

; Group for call routing
group = 1

; Signal check interval (seconds)
signalpoll = 30

; Call timeout (seconds)
calltimeout = 30

; Auto-answer incoming calls
autoanswer = no

; DTMF mode
dtmfmode = inband

; ── Multiple SIM Support ──
; Add more dongle sections for multiple SIM cards
; [dongle1]
; device = /dev/ttyUSB1
; context = inbound-context
; group = 2
