; Asterisk Manager Interface (AMI) configuration
; Used by PHP AsteriskService to control calls

[general]
enabled = yes
port = 5038
bindaddr = 0.0.0.0
networkmask = 0.0.0.0/0

; ── Admin User (for PHP backend) ──
[admin]
secret = ApsDreamHome2026!
deny = 0.0.0.0/0
permit = 172.28.0.0/16
permit = 127.0.0.1/32
read = system,call,log,verbose,command,agent,user,config,dtmf,reporting,cdr,dialplan
write = system,call,log,verbose,command,agent,user,config,dtmf,reporting,cdr,dialplan

; ── Read-only User (for monitoring) ──
[readonly]
secret = ApsReadOnly2026!
deny = 0.0.0.0/0
permit = 172.28.0.0/16
read = system,call,log,verbose,reporting,cdr
write = none
