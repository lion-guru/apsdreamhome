; APS Dream Home - Asterisk Dialplan for SIM Card Calling
; Place this in /etc/asterisk/extensions.conf

[general]
static=yes
writeprotect=no
clearglobalvars=no

; ── Outbound Calls Context ──
[outbound-calls]
; Context for outbound calls via GSM Gateway (chan_dongle)
exten => s,1,NoOp(Starting outbound call - APS Dream Home)
 same => n,Set(CALLID=${CALLID})
 same => n,Set(SCHEDULE_ID=${SCHEDULE_ID})
 same => n,Set(SESSION_ID=${SESSION_ID})
 same => n,Set(LEAD_ID=${LEAD_ID})
 same => n,Set(LEAD_NAME=${LEAD_NAME})
 same => n,Set(CUSTOMER=${CUSTOMER_PHONE})
 same => n,Answer()
 same => n,Wait(1)
 same => n,Goto(ivr-menu,s,1)

; ── IVR Menu ──
[ivr-menu]
exten => s,1,NoOp(IVR Started for ${CUSTOMER})
 same => n,Background(/var/lib/asterisk/sounds/aps/hello_hi)
 same => n,WaitExten(5)
 same => n,Goto(ai-agent,s,1)

exten => 1,1,Goto(ai-agent,s,1)
exten => 2,1,Goto(book-plot,s,1)
exten => 3,1,Goto(connect-sales,s,1))
exten => 9,1,Hangup()

; ── AI Agent Connection ──
[ai-agent]
; Connect to AI agent via AGI script
exten => s,1,NoOp(Connecting to AI Agent for ${LEAD_NAME})
 same => n,AGI(/var/lib/asterisk/agi/aps_ai_agent.php,${CALLID},${CUSTOMER},${SESSION_ID})
 same => n,Hangup()

; ── Quick Booking ──
[book-plot]
exten => s,1,NoOp(Quick booking for ${CUSTOMER})
 same => n,Playback(/var/lib/asterisk/sounds/aps/booking_info)
 same => n,Hangup()

; ── Transfer to Sales ──
[connect-sales]
exten => s,1,NoOp(Transferring to sales team)
 same => n,Playback(/var/lib/asterisk/sounds/aps/connecting_sales)
 same => n,Dial(PJSIP/sales@sales-trunk,30)
 same => n,Hangup()

; ── EMI Reminder Calls ──
[emi-reminder]
exten => s,1,NoOp(EMI Reminder for ${CUSTOMER})
 same => n,Set(AMOUNT=${EMI_AMOUNT})
 same => n,Set(DUE_DATE=${EMI_DUE_DATE})
 same => n,Set(DAYS_OVERDUE=${DAYS_OVERDUE})
 same => n,Playback(/var/lib/asterisk/sounds/aps/emi_reminder_hi)
 same => n,Background(/var/lib/asterisk/sounds/aps/emi_amount_${AMOUNT})
 same => n,WaitExten(5)
 same => n,Goto(emi-options,s,1)

exten => 1,1,Goto(pay-now,s,1)
exten => 2,1,Goto(connect-sales,s,1)
exten => 3,1,Hangup()

; ── Pay Now ──
[pay-now]
exten => s,1,NoOp(Pay now option)
 same => n,Playback(/var/lib/asterisk/sounds/aps/pay_now_info)
 same => n,Hangup()

; ── Inbound Calls ──
[inbound-context]
exten => s,1,NoOp(Inbound call received)
 same => n,Set(CALLER=${CALLERID(num)})
 same => n,Answer()
 same => n,Wait(1)
 same => n,Goto(ivr-menu,s,1)

; ── AGI Script for AI Conversation ──
; /var/lib/asterisk/agi/aps_ai_agent.php
; This script:
; 1. Receives call events from Asterisk
; 2. Captures customer audio
; 3. Sends to AIVoicePipeline for STT → LLM → TTS
; 4. Plays back AI response
; 5. Logs conversation to database
