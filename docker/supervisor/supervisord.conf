[supervisord]
nodaemon=true
user=root
logfile=/var/log/supervisor/supervisord.log
logfile_maxbytes=50MB
logfile_backups=10
loglevel=info
pidfile=/var/run/supervisord.pid

[program:php-fpm]
command=/usr/local/sbin/php-fpm8.2 -F
process_name=php-fpm
numprocs=1
autostart=true
autorestart=true
startsecs=5
startretries=3
user=www-data
stdout_logfile=/var/log/supervisor/php-fpm.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=5
stderr_logfile=/var/log/supervisor/php-fpm-error.log
stderr_logfile_maxbytes=10MB
stderr_logfile_backups=5
priority=100

[program:nginx]
command=nginx -g "daemon off;"
process_name=nginx
numprocs=1
autostart=true
autorestart=true
startsecs=5
startretries=3
user=root
stdout_logfile=/var/log/supervisor/nginx.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=5
stderr_logfile=/var/log/supervisor/nginx-error.log
stderr_logfile_maxbytes=10MB
stderr_logfile_backups=5
priority=90

[program:cron]
command=cron -f -L 15
process_name=cron
numprocs=1
autostart=true
autorestart=true
startsecs=5
startretries=3
user=root
stdout_logfile=/var/log/supervisor/cron.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=5
stderr_logfile=/var/log/supervisor/cron-error.log
stderr_logfile_maxbytes=10MB
stderr_logfile_backups=5
priority=80

[program:websocket]
command=php /var/www/html/websocket_server.php
process_name=websocket
numprocs=1
autostart=true
autorestart=true
startsecs=10
startretries=3
user=www-data
stdout_logfile=/var/log/supervisor/websocket.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=5
stderr_logfile=/var/log/supervisor/websocket-error.log
stderr_logfile_maxbytes=10MB
stderr_logfile_backups=5
priority=70