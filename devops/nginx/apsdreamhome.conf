# ==============================================================================
# APS DREAM HOME — ENTERPRISE NGINX CONFIGURATION (Ubuntu 22.04 / 24.04)
# Domain: apsdreamhome.com & www.apsdreamhome.com
# Root: /var/www/apsdreamhome/public
# ==============================================================================

# 1. HTTP Server (Redirect to HTTPS after Certbot / Cloudflare SSL)
server {
    listen 80;
    listen [::]:80;
    server_name apsdreamhome.com www.apsdreamhome.com;

    # Let's Encrypt ACME Challenge Directory
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/apsdreamhome/public;
        allow all;
    }

    # Redirect all HTTP requests to HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

# 2. HTTPS Server (Production)
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name apsdreamhome.com www.apsdreamhome.com;

    root /var/www/apsdreamhome/public;
    index index.php index.html;

    # SSL Certificates (managed via certbot --nginx)
    # ssl_certificate /etc/letsencrypt/live/apsdreamhome.com/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/apsdreamhome.com/privkey.pem;
    # include /etc/letsencrypt/options-ssl-nginx.conf;
    # ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # Client upload limits (for property images, floor plans, and KYC PDFs)
    client_max_body_size 64M;
    client_body_buffer_size 128k;

    # Gzip Compression for maximum mobile & web speed
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript application/rss+xml application/atom+xml image/svg+xml;

    # Enterprise Security Headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(self)" always;

    # Main Application Routing
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # PHP-FPM Handler
    location ~ \.php$ {
        try_files $uri =404;
        fastcgi_split_path_info ^(.+\.php)(/.+)$;
        
        # PHP 8.2 or 8.3 socket
        fastcgi_pass unix:/run/php/php8.3-fpm.sock;
        # Fallback to php8.2-fpm if 8.3 is not installed:
        # fastcgi_pass unix:/run/php/php8.2-fpm.sock;

        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param PATH_INFO $fastcgi_path_info;
        
        # Buffer tuning for large responses
        fastcgi_buffer_size 128k;
        fastcgi_buffers 256 16k;
        fastcgi_busy_buffers_size 256k;
        fastcgi_temp_file_write_size 256k;
        fastcgi_read_timeout 300;
    }

    # WebSocket Proxy for Real-Time Notifications & Chat
    location /ws/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "Upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    # Static Assets Caching (CSS, JS, Fonts, Images)
    location ~* \.(jpg|jpeg|png|gif|ico|css|js|woff2|woff|ttf|svg|webp|pdf)$ {
        expires 30d;
        add_header Cache-Control "public, no-transform";
        access_log off;
        log_not_found off;
    }

    # Deny access to sensitive hidden files & directories (.env, .git, etc.)
    location ~ /\.(?!well-known).* {
        deny all;
        access_log off;
        log_not_found off;
    }

    # Deny direct access to sensitive file extensions
    location ~* \.(env|yml|yaml|sql|log|sh|bat|md)$ {
        deny all;
        access_log off;
        log_not_found off;
    }

    # Logging
    access_log /var/log/nginx/apsdreamhome_access.log;
    error_log /var/log/nginx/apsdreamhome_error.log warn;
}
