# =============================================================================
# APS Dream Home - Development Docker Compose (GitHub Codespaces + local Docker)
# Services: PHP 8.2 (Apache, port 80), MySQL 8 (port 3307), Node.js (E2E tests)
# =============================================================================
services:
  app:
    build:
      context: .
      dockerfile: .devcontainer/php-dev.Dockerfile
    container_name: apsdreamhome_dev_app
    user: "${UID:-0}:${GID:-0}"
    volumes:
      - .:/workspace
    ports:
      - "80:80"
    depends_on:
      db:
        condition: service_healthy
    environment:
      - DB_HOST=db
      - DB_PORT=3307
      - DB_DATABASE=apsdreamhome
      - DB_USERNAME=root
      - DB_PASSWORD=
    command: >
      bash -c "
        mkdir -p /workspace/storage/logs /workspace/storage/cache /workspace/storage/sessions /workspace/logs;
        chown -R 33:33 /workspace/storage /workspace/public/uploads /workspace/logs 2>/dev/null;
        chmod -R 775 /workspace/storage /workspace/public/uploads /workspace/logs 2>/dev/null;
        for i in $$(seq 1 30); do mysqladmin ping -h db -P 3307 --silent 2>/dev/null && break; sleep 1; done;
        echo 'MySQL is ready';
        apache2-foreground
      "

  db:
    image: mysql:8.0
    container_name: apsdreamhome_dev_db
    restart: unless-stopped
    ports:
      - "3307:3307"
    environment:
      - MYSQL_ROOT_PASSWORD=
      - MYSQL_DATABASE=apsdreamhome
      - MYSQL_USER=apsdev
      - MYSQL_PASSWORD=apsdev
    volumes:
      - db_data:/var/lib/mysql
      - ./database/apsdreamhome_latest.sql:/docker-entrypoint-initdb.d/apsdreamhome.sql:ro
      - ./docker/mysql/dev.cnf:/etc/mysql/conf.d/dev.cnf:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 10s

  node:
    image: node:20-bullseye
    container_name: apsdreamhome_dev_node
    user: "${UID:-0}:${GID:-0}"
    volumes:
      - .:/workspace
    working_dir: /workspace
    environment:
      - PLAYWRIGHT_BROWSERS_PATH=/root/.cache/ms-playwright
    command: "tail -f /dev/null"

volumes:
  db_data: