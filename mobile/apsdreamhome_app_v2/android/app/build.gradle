plugins {
    id "com.android.application"
    id "dev.flutter.flutter-gradle-plugin"
}

// S453: android/app/google-services.json holds the Firebase API key and is
// gitignored on purpose, so it does NOT exist on the CI runner.  Applying
// the google-services plugin unconditionally made the release build die with
//   "Execution failed for task ':app:processReleaseGoogleServices'"
// even though everything else compiled.  Apply it only when the file is
// there, so a CI smoke APK builds without Firebase config while a local
// build (and any build that provides the file) keeps the full config.
//
// To get a Firebase-enabled APK out of CI, add the file as a repository
// secret and write it before the build:
//   echo "$GOOGLE_SERVICES_JSON" | base64 -d > android/app/google-services.json
if (file('google-services.json').exists()) {
    apply plugin: 'com.google.gms.google-services'
}

def localProperties = new Properties()
def localPropertiesFile = rootProject.file('local.properties')
if (localPropertiesFile.exists()) {
    localPropertiesFile.withReader('UTF-8') { reader ->
        localProperties.load(reader)
    }
}

def flutterVersionCode = localProperties.getProperty('flutter.versionCode')
if (flutterVersionCode == null) {
    flutterVersionCode = '2'
}

def flutterVersionName = localProperties.getProperty('flutter.versionName')
if (flutterVersionName == null) {
    flutterVersionName = '1.1'
}

android {
    namespace "com.apsdreamhomes.mobileapp"
    compileSdkVersion 36

    ndkVersion "28.2.13676358"
    lintOptions {
        disable 'InvalidPackage'
    }

    compileOptions {
        coreLibraryDesugaringEnabled true
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }

    sourceSets {
        main.java.srcDirs += 'src/main/kotlin'
    }

    defaultConfig {
        applicationId "com.apsdreamhomes.mobileapp"
        minSdkVersion flutter.minSdkVersion
        targetSdkVersion 36
        versionCode flutterVersionCode.toInteger()
        versionName flutterVersionName
        multiDexEnabled true
    }

    signingConfigs {
        release {
            def keyPropsFile = rootProject.file('key.properties')
            if (keyPropsFile.exists()) {
                def keyProps = new Properties()
                keyProps.load(new FileInputStream(keyPropsFile))
                def keystoreFile = rootProject.file(keyProps['storeFile'])
                storeFile keystoreFile.exists() ? keystoreFile : file(keyProps['storeFile'])
                storePassword keyProps['storePassword']
                keyAlias keyProps['keyAlias']
                keyPassword keyProps['keyPassword']
            }
        }
    }

    buildTypes {
        release {
            signingConfig signingConfigs.release
            minifyEnabled false
            shrinkResources false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
        debug {
            signingConfig signingConfigs.debug
        }
    }
}

flutter {
    source '../..'
}

dependencies {
    implementation 'androidx.multidex:multidex:2.0.1'
    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.1.4'
}
