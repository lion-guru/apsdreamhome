# NOTE (S453): org.gradle.java.home is deliberately NOT set here.
# It used to point at 'C:\\Program Files\\Android\\Android Studio\\jbr',
# a Windows-only absolute path - on the Linux CI runner that is an
# invalid Java home and the Gradle build died with
#   "Value 'C:\\Program Files\\...' given for org.gradle.java.home
#    Gradle property is invalid (Java home supplied is invalid)"
# Set it locally in ~/.gradle/gradle.properties, or let the Flutter tool
# pick the JDK (flutter config --jdk-dir=<path>).
org.gradle.jvmargs=-Xmx4096m -Dfile.encoding=UTF-8 -XX:MaxMetaspaceSize=1024m
android.useAndroidX=true
android.enableJetifier=true
android.suppressUnsupportedCompileSdk=36
target-platform=android-arm,android-x64
android.builtInKotlin=true
android.newDsl=true
