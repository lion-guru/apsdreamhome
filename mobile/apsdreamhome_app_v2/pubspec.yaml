name: apsdreamhome_app_v2
description: APS Dream Home Flutter application
publish_to: 'none'
version: 1.0.0+1
environment:
  sdk: ^3.12.0

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.2
  flutter_localizations:
    sdk: flutter

  # State management
  flutter_riverpod: ^2.4.0
  go_router: ^12.0.0
  provider: ^6.1.1

  # Networking
  dio: ^5.4.0
  http: ^1.2.0
  connectivity_plus: ^6.0.0
  url_launcher: ^6.2.0

  # Camera & Media
  camera: ^0.11.0
  image_picker: ^1.1.0
  flutter_svg: ^2.0.0

  # Fonts
  google_fonts: ^6.1.0

  # Permissions & Location
  permission_handler: ^11.0.0
  geolocator: 11.1.0

  # Storage
  flutter_secure_storage: ^9.0.0
  sqflite: ^2.3.0
  path_provider: ^2.1.0
  path: ^1.9.0
  shared_preferences: ^2.2.0

  # Environment
  flutter_dotenv: ^5.1.0

  # Code generation (freezed + json_serializable)
  freezed_annotation: ^2.4.0
  json_annotation: ^4.9.0

  # Utilities
  intl: ^0.20.2
  logger: ^2.0.0
  uuid: ^4.3.0
  crypto: ^3.0.3

  # UI
  shimmer: ^3.0.0
  fl_chart: ^0.68.0
  qr_flutter: ^4.1.0
  cached_network_image: ^3.4.0
  font_awesome_flutter: ^10.7.0

  # PDF & Sharing
  pdf: ^3.10.0
  printing: ^5.15.0
  share_plus: ^7.2.0

  # Device
  local_auth: ^2.1.0
  package_info_plus: 9.0.1
  speech_to_text: 7.4.0

  # Google APIs (for Drive backup)
  googleapis: ^12.0.0
  googleapis_auth: ^1.6.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^2.0.0
  build_runner: ^2.4.0
  freezed: ^2.5.0
  json_serializable: ^6.7.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - .env
