name: apsdreamhome_app_v2
description: APS Dream Home Flutter application
publish_to: 'none'
version: 1.2.10+13
environment:
  sdk: ^3.12.0

dependencies:
  cached_network_image: ^3.4.0

  # Camera & Media
  camera: ^0.12.0+1

  connectivity_plus: ^7.2.0

  crypto: ^3.0.3

  # Kept: a plugin references the CupertinoIcons font family; removing this
  # dep drops the font and logs a build warning (blank glyph risk)
  cupertino_icons: ^1.0.2

  # Networking
  dio: ^5.4.0

  # Firebase
  firebase_core: ^4.11.0

  firebase_messaging: ^16.4.1

  flutter:
    sdk: flutter

  # Background Tasks & Queue
  flutter_background_service: ^5.0.5

  # Environment
  flutter_dotenv: ^6.0.1

  flutter_local_notifications: ^22.0.1

  flutter_localizations:
    sdk: flutter

  # State management
  flutter_riverpod: ^3.3.2

  # Storage
  flutter_secure_storage: ^10.3.1

  flutter_svg: ^2.0.0

  flutter_tts: ^4.2.0

  font_awesome_flutter: ^11.0.0

  # Code generation (freezed + json_serializable)
  freezed_annotation: ^3.1.0

  geolocator: ^14.0.3

  go_router: ^17.3.0

  # Fonts
  google_fonts: ^8.1.0

  # Google Sign-In
  google_sign_in: ^6.2.2

  # Google APIs (for Drive backup)
  googleapis: ^16.0.0

  googleapis_auth: ^2.3.2

  hive: ^2.2.3

  hive_flutter: ^1.1.0

  http: ^1.2.0

  image_picker: ^1.1.0

  # Utilities
  intl: ^0.20.2

  json_annotation: ^4.9.0

  # Device
  local_auth: ^3.0.1

  logger: ^2.0.0

  package_info_plus: ^10.2.0

  path: ^1.9.0

  path_provider: ^2.1.0

  # PDF & Sharing
  pdf: ^3.10.0

  # Permissions & Location
  permission_handler: ^12.0.3

  printing: ^5.15.0

  # Payment Gateway
  razorpay_flutter: ^1.3.7

  riverpod: ^3.3.2

  rxdart: ^0.28.0

  share_plus: ^13.2.0

  shared_preferences: ^2.2.0

  # UI
  shimmer: ^3.0.0

  speech_to_text: 7.4.0

  sqflite: ^2.3.0

  url_launcher: ^6.2.0

  uuid: ^4.3.0

  workmanager: ^0.10.10

dev_dependencies:
  build_runner: ^2.4.0
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter
  freezed: ^3.2.5
  json_serializable: ^6.7.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
