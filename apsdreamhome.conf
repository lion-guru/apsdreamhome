# Nginx virtual host for APS Dream Home (Production)
# Place in: /etc/nginx/sites-available/apsdreamhome.conf
# Symlink: ln -s /etc/nginx/sites-available/apsdreamhome.conf /etc/nginx/sites-enabled/

server {
    listen 80;
    server_name apsdreamhome.com www.apsdreamhome.com;
    root /var/www/apsdreamhome/public;
    index index.php index.html;

    client_max_body_size 64M;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        fastcgi_pass unix:/run/php/php8.3-fpm.sock;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        include fastcgi_params;
        fastcgi_buffer_size 128k;
        fastcgi_buffers 256 16k;
    }

    # Real-Time WebSocket Notifications
    location /ws/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "Upgrade";
        proxy_set_header Host $host;
    }

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;

    # Protect sensitive files
    location ~ /\.(?!well-known).* {
        deny all;
    }

    location ~* \.(env|sql|log|sh|bat)$ {
        deny all;
    }
}
