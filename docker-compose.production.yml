# =============================================================================
# APS Dream Home - Production Compose Overrides
#
# Merge with: docker compose -f docker-compose.yml -f docker-compose.production.yml up -d
#
# Production-specific overrides:
#   - 2x app replicas for HA
#   - Resource limits (CPU + memory) on every service
#   - No bind mounts (named volumes only)
#   - Force HTTPS via FORCE_HTTPS env var
#   - Different public ports (HTTP 8080, HTTPS 8443) for reverse-proxy
#     setups; set HTTP_PORT/HTTPS_PORT in production.env to override.
#   - Reference production.env
# =============================================================================

# =============================================================================
# APS Dream Home - Production Compose Overrides
#
# Merge with: docker compose -f docker-compose.yml -f docker-compose.production.yml up -d
#
# Production-specific overrides:
#   - 2x app replicas for HA
#   - Resource limits (CPU + memory) on every service
#   - No bind mounts (named volumes only)
#   - Force HTTPS via FORCE_HTTPS env var
#   - Different public ports (HTTP 8080, HTTPS 8443) for reverse-proxy
#     setups; set HTTP_PORT/HTTPS_PORT in production.env to override.
#   - Reference production.env
# =============================================================================

# ---------------------------------------------------------------------------
# Anchor for production env (APP_ENV=production, APP_DEBUG=false, force HTTPS)
# ---------------------------------------------------------------------------
x-app-env-prod: &app-env-prod
  APP_ENV: production
  APP_DEBUG: "false"
  APP_URL: ${APP_URL}
  APP_KEY: ${APP_KEY}
  FORCE_HTTPS: ${FORCE_HTTPS:-true}

  DB_HOST: db
  DB_PORT: "3306"
  DB_DATABASE: ${DB_DATABASE}
  DB_USERNAME: ${DB_USERNAME}
  DB_PASSWORD: ${DB_PASSWORD}

  REDIS_HOST: redis
  REDIS_PORT: "6379"
  REDIS_PASSWORD: ${REDIS_PASSWORD:-}
  CACHE_DRIVER: redis
  SESSION_DRIVER: redis
  QUEUE_CONNECTION: redis

  WEBSOCKET_HOST: websocket
  WEBSOCKET_PORT: ${WEBSOCKET_PORT:-8080}

  MAIL_MAILER: ${MAIL_MAILER:-smtp}
  MAIL_HOST: ${MAIL_HOST}
  MAIL_PORT: ${MAIL_PORT}
  MAIL_USERNAME: ${MAIL_USERNAME}
  MAIL_PASSWORD: ${MAIL_PASSWORD}
  MAIL_ENCRYPTION: ${MAIL_ENCRYPTION:-tls}
  MAIL_FROM_ADDRESS: ${MAIL_FROM_ADDRESS}
  MAIL_FROM_NAME: ${MAIL_FROM_NAME}

  SENTRY_DSN: ${SENTRY_DSN:-}
  SLACK_WEBHOOK: ${SLACK_WEBHOOK:-}

  TZ: ${TZ:-Asia/Kolkata}
  LOG_CHANNEL: ${LOG_CHANNEL:-stderr}

services:
  # ---------------------------------------------------------------------------
  # 1. PHP-Apache App - scaled to 2 for HA + resource limits
  # ---------------------------------------------------------------------------
  app:
    # Note: container_name was removed from docker-compose.yml base
    # to allow scaling. Replicas get auto-generated names.
    environment:
      <<: *app-env-prod
    # Override the dev bind-mount in docker-compose.yml - production uses
    # only named volumes for storage (no source-tree bind mount).
    volumes:
      - app_storage:/var/www/html/storage
      - app_uploads:/var/www/html/public/uploads
      - app_assets_uploads:/var/www/html/public/assets/uploads
      - app_logs:/var/log/apache2
      - ./docker/cron/schedule:/etc/cron.d/apsdream:ro
    deploy:
      replicas: 2
      update_config:
        parallelism: 1
        delay: 10s
        order: start-first
        failure_action: rollback
      rollback_config:
        parallelism: 1
        delay: 5s
      restart_policy:
        condition: on-failure
        max_attempts: 3
      resources:
        limits:
          cpus: "1.0"
          memory: 1G
        reservations:
          cpus: "0.25"
          memory: 256M
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost/health -o /dev/null || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 30s

  # ---------------------------------------------------------------------------
  # 2. WebSocket - single instance (sticky by design)
  # ---------------------------------------------------------------------------
  websocket:
    environment:
      <<: *app-env-prod
    deploy:
      replicas: 1
      resources:
        limits:
          cpus: "0.5"
          memory: 256M
        reservations:
          cpus: "0.1"
          memory: 64M
    healthcheck:
      test: ["CMD-SHELL", "php -r 'exit(@fsockopen(\"127.0.0.1\", 8080) ? 0 : 1);'"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  # ---------------------------------------------------------------------------
  # 3. MySQL - production tuned
  # ---------------------------------------------------------------------------
  db:
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${DB_DATABASE}
      MYSQL_USER: ${DB_USERNAME}
      MYSQL_PASSWORD: ${DB_PASSWORD}
      TZ: ${TZ:-Asia/Kolkata}
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 3G
        reservations:
          cpus: "0.5"
          memory: 1G

  # ---------------------------------------------------------------------------
  # 4. Redis - more memory, persistence tuned
  # ---------------------------------------------------------------------------
  redis:
    command:
      - redis-server
      - /usr/local/etc/redis/redis.conf
      - --maxmemory
      - "768mb"
      - --maxmemory-policy
      - "allkeys-lru"
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 1G
        reservations:
          cpus: "0.1"
          memory: 128M

  # ---------------------------------------------------------------------------
  # 5. Nginx - bind to non-standard public ports (8080/8443)
  #    Use a separate reverse proxy (CloudFront, ALB, etc.) in front
  #    for TLS termination and DDoS protection.
  # ---------------------------------------------------------------------------
  nginx:
    ports:
      # Non-standard ports (8080 HTTP, 8443 HTTPS) for production
      # Set HTTP_PORT=80 HTTPS_PORT=443 in production.env if you want
      # nginx to be the public edge.
      - "${HTTP_PORT:-8080}:80"
      - "${HTTPS_PORT:-8443}:443"
    volumes:
      - ./docker/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./docker/nginx/conf.d:/etc/nginx/conf.d:ro
      - ./docker/ssl:/etc/ssl/certs:ro
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M
        reservations:
          cpus: "0.1"
          memory: 64M
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

# ---------------------------------------------------------------------------
# Named volumes (persistent data) - production uses local driver
# No bind mounts, no source-tree mounting
# ---------------------------------------------------------------------------
volumes:
  db_data:
    driver: local
  db_backups:
    driver: local
  redis_data:
    driver: local
  app_storage:
    driver: local
  app_uploads:
    driver: local
  app_assets_uploads:
    driver: local
  app_logs:
    driver: local
  nginx_logs:
    driver: local
